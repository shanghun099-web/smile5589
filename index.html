<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>출입코드 노트</title>
<meta name="theme-color" content="#0a0a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="출입코드">
<link rel="apple-touch-icon" id="touch-icon" href="icon-195.png">
<link rel="icon" id="fav-icon" type="image/png" href="icon-195.png">
<link rel="manifest" id="pwa-manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0e;--s1:#101015;--s2:#16161e;--s3:#1e1e28;
  --border:#1e1e2c;--border2:#2a2a3c;--border3:#363650;
  --amber:#f59e0b;--amber2:#fcd34d;--amber-dim:#7c4f06;
  --blue:#60a5fa;--blue-dim:#1e3a5f;
  --green:#34d399;--green2:#6ee7b7;
  --red:#f87171;
  --text:#f2f2f8;--text2:#a8a8c4;--text3:#7a7a98;
  --mono:'IBM Plex Mono',monospace;--sans:'Noto Sans KR',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
.app{display:flex;flex-direction:column;height:100dvh;height:100vh;max-width:560px;margin:0 auto;}

.topbar{flex-shrink:0;padding:14px 16px 0;}
.header{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.hicon{width:32px;height:32px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:0 2px 12px rgba(245,158,11,.25);}
.hinfo{flex:1;}
.hinfo h1{font-size:15px;font-weight:700;color:var(--text);letter-spacing:.07em;text-transform:uppercase;}
.hinfo p{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:1px;}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.add-rgn-btn{display:flex;align-items:center;gap:4px;padding:10px 11px;background:linear-gradient(135deg,var(--amber),#d97706);color:#0a0a0e;font-weight:700;font-size:14px;font-family:var(--sans);border:none;border-radius:9px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-rgn-btn:active{opacity:.8;}
.backup-btn{width:36px;height:36px;background:var(--s3);border:1px solid var(--border2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;transition:border-color .2s,background .2s;}
.backup-btn:active{background:var(--border2);}

.swrap{position:relative;padding:10px 16px 8px;flex-shrink:0;}
.swrap input{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px 12px 42px;color:var(--text);font-size:16px;font-family:var(--sans);outline:none;transition:border-color .2s,box-shadow .2s;}
.swrap input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.1);}
.swrap input::placeholder{color:var(--text3);}
.si{position:absolute;left:29px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
.swrap input{padding-right:52px;}
.mic-btn{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:9px;border:1px solid var(--border2);background:var(--s3);color:var(--text2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mic-btn:active{transform:translateY(-50%) scale(.9);}
.swrap.has-q input{padding-right:96px;}
.clr-btn{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:9px;border:1px solid var(--border2);background:var(--s3);color:var(--text2);font-size:15px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.swrap.has-q .clr-btn{display:flex;}
.clr-btn:active{transform:translateY(-50%) scale(.9);}
.mic-btn.listening{color:#fff;background:var(--red);border-color:var(--red);animation:micPulse 1s ease-in-out infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5);}50%{box-shadow:0 0 0 8px rgba(248,113,113,0);}}

.cscroll{flex:1;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity;padding:4px 16px 50px;}
.cscroll::-webkit-scrollbar{width:3px;}
.cscroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
body.dragging .cscroll{scroll-snap-type:none; user-select: none; -webkit-user-select: none;}

.dh{
  align-self:stretch;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;
  cursor:grab;color:var(--text3);font-size:17px;letter-spacing:-.5px;transition:color .15s,background .15s;
}
.dh.rh{width:36px;border-right:1px solid var(--border);}
.dh.ch{width:30px;border-right:1px solid var(--border);}
.dh.kh{width:28px;}
.dh.pressing{color:var(--amber);background:rgba(245,158,11,.1);}
.cscroll.searching .dh{opacity:0;pointer-events:none;}

.drop-line{height:3px;background:linear-gradient(90deg,transparent,var(--amber) 15%,var(--amber) 85%,transparent);border-radius:3px;margin:2px 0;pointer-events:none;flex-shrink:0;}

.empty-state{text-align:center;padding:60px 20px 20px;}
.empty-state .eico{font-size:40px;margin-bottom:14px;}
.empty-state p{color:var(--text2);font-size:15px;line-height:1.8;}
.empty-state strong{color:var(--amber);}
.no-results{text-align:center;padding:50px 20px;color:var(--text2);font-size:15px;font-family:var(--mono);}

.region-card{scroll-snap-align:start;margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid var(--border);transition:border-color .2s,box-shadow .15s;}
.region-card.open{border-color:var(--border3);box-shadow:0 4px 24px rgba(0,0,0,.5);}
.region-card.drag-placeholder{opacity:.2;pointer-events:none;}
.rg-hdr{display:flex;align-items:center;background:var(--s1);min-height:60px;user-select:none;}
.rg-bar{width:4px;align-self:stretch;flex-shrink:0;background:linear-gradient(180deg,var(--amber),var(--amber-dim));opacity:.6;transition:opacity .2s;}
.region-card.open .rg-bar{opacity:1;}
.rg-clickable{display:flex;align-items:center;gap:10px;flex:1;padding:12px 10px 12px 14px;min-width:0;cursor:pointer;}
.rg-ico{width:36px;height:36px;border-radius:10px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.region-card.open .rg-ico{background:rgba(245,158,11,.2);}
.rg-name{font-size:19px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rg-meta{font-size:13px;color:var(--text2);font-family:var(--mono);margin-top:2px;}
.rg-acts{display:flex;align-items:center;gap:3px;padding:0 8px 0 0;flex-shrink:0;}
.abt{width:33px;height:33px;border:1px solid var(--border2);border-radius:9px;background:var(--s3);color:var(--text2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.abt:active{transform:scale(.9);}
.abt.add{color:var(--amber);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08);}
.abt.share,.asm.share{color:var(--amber);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08);}
.abt.del{color:var(--red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06);}
.chv{color:var(--text3);font-size:11px;transition:transform .25s;margin-left:2px;flex-shrink:0;}
.region-card.open .chv.r{transform:rotate(180deg);color:var(--amber);}
.rg-body{display:none;background:var(--bg);padding:8px 10px 10px;}
.region-card.open .rg-body{display:block;}

.complex-card{border-radius:12px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;transition:border-color .2s;}
.complex-card.open{border-color:var(--border2);box-shadow:0 2px 14px rgba(0,0,0,.4);}
.complex-card.drag-placeholder{opacity:.2;pointer-events:none;}
.cx-hdr{display:flex;align-items:center;background:var(--s2);min-height:50px;user-select:none;}
.cx-bar{width:3px;align-self:stretch;flex-shrink:0;background:linear-gradient(180deg,var(--blue),var(--blue-dim));opacity:.5;transition:opacity .2s;}
.complex-card.open .cx-bar{opacity:1;}
.cx-clickable{display:flex;align-items:center;gap:8px;flex:1;padding:10px 5px 10px 10px;min-width:0;cursor:pointer;}
.cx-ico{width:28px;height:28px;border-radius:8px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.complex-card.open .cx-ico{background:rgba(96,165,250,.18);}
.cx-col{flex:1;min-width:0;}
.cx-name{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cx-addr{font-size:13px;color:var(--text2);font-family:var(--mono);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cx-acts{display:flex;align-items:center;gap:2px;padding:0 7px 0 0;}
.asm{width:30px;height:30px;border:1px solid var(--border2);border-radius:8px;background:var(--s3);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.asm:active{transform:scale(.88);}
.asm.add{color:var(--blue);border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08);}
.asm.del{color:var(--red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06);}
.chv.c{color:var(--text3);font-size:10px;transition:transform .2s;}
.complex-card.open .chv.c{transform:rotate(180deg);color:var(--blue);}
.cx-body{display:none;background:var(--s1);padding:8px 10px 10px;}
.complex-card.open .cx-body{display:block;}

.sec-lbl{font-size:17px;font-weight:700;color:#fff;line-height:1.3;padding:8px 12px;margin:10px 0 6px;border-left:5px solid var(--amber);background:var(--s3);border-radius:0 10px 10px 0;}
.sec-lbl:first-child{margin-top:2px;}

.code-row{display:flex;align-items:center;background:var(--s2);border:1px solid var(--border2);border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden;}
.code-row.global{background:rgba(245,158,11,.05);border-color:rgba(245,158,11,.18);}
.code-row.copied{border-color:var(--green)!important;background:rgba(52,211,153,.06)!important;}
.code-row.drag-placeholder{opacity:.2;pointer-events:none;}
.code-main{flex:1;min-width:0;cursor:pointer;padding:16px 14px;}
.code-lbl{font-size:15px;color:var(--text);font-weight:500;line-height:1.4;}
.code-memo{font-size:16px;color:#d1d5db;line-height:1.5;margin-bottom:8px;word-break:break-word;}
.code-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--green2);line-height:1.2;word-break:break-all;letter-spacing:.04em;}
.code-row.global .code-val{color:var(--amber2);}
.code-acts{display:flex;gap:3px;padding:0 8px 0 0;flex-shrink:0;}
.copy-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;color:var(--green);font-weight:700;font-family:var(--mono);background:rgba(10,10,14,.92);padding:3px 12px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap;}
.code-row.copied .copy-hint{opacity:1;}
.zoom-copy{width:100%;padding:13px;border:none;border-radius:11px;background:var(--amber);color:#1a1200;font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;margin-top:4px;}
.zoom-copy:active{transform:scale(.98);}
.add-row-btn{width:100%;padding:13px;border:1px dashed var(--border3);border-radius:10px;background:transparent;color:var(--text2);font-size:15px;font-family:var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:border-color .15s,color .15s;margin-top:4px;}
.add-row-btn.amber-btn{border-color:rgba(245,158,11,.22);color:rgba(245,158,11,.5);}
.add-row-btn:active{border-color:var(--amber);color:var(--amber);}

.movl{position:fixed;inset:0;background:rgba(5,5,10,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.movl.active{opacity:1;pointer-events:all;}
.mbox{width:100%;max-width:420px;background:var(--s2);border:1px solid var(--border3);border-radius:18px;padding:24px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.7);transform:scale(.93) translateY(16px);transition:transform .25s cubic-bezier(.34,1.56,.64,1);max-height:90vh;overflow-y:auto;}
.movl.active .mbox{transform:scale(1) translateY(0);}
.mtitle{font-size:19px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.fg{margin-bottom:14px;}
.flbl{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block;}
.finp{width:100%;background:var(--s3);border:1px solid var(--border2);border-radius:10px;padding:13px 14px;color:var(--text);font-size:17px;font-family:var(--sans);outline:none;transition:border-color .2s,box-shadow .2s;}
.finp:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.1);}
.finp::placeholder{color:var(--text3);}
.fhint{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.5;}
.fchk{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--s3);border:1px solid var(--border2);border-radius:9px;cursor:pointer;}
.fchk input[type=checkbox]{width:16px;height:16px;accent-color:var(--amber);}
.fchk label{font-size:15px;color:var(--text2);cursor:pointer;}
.kprev{pointer-events:none;padding:8px;background:var(--s1);border:1px dashed var(--border2);border-radius:12px;}
.kprev .sec-lbl{margin-top:0;}
.kprev .code-row{margin-bottom:0;}
.macts{display:flex;gap:8px;margin-top:20px;}
.bpri{flex:1;padding:14px;background:linear-gradient(135deg,var(--amber),#d97706);color:#0a0a0e;font-weight:700;font-size:16px;font-family:var(--sans);border:none;border-radius:11px;cursor:pointer;}
.bpri:active{opacity:.85;}
.bsec{padding:13px 18px;background:var(--s3);color:var(--text2);font-weight:600;font-size:15px;font-family:var(--sans);border:1px solid var(--border2);border-radius:11px;cursor:pointer;}
.bsec:active{background:var(--border2);}
.cbox{width:100%;max-width:320px;background:var(--s2);border:1px solid var(--border3);border-radius:18px;padding:26px 22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.7);transform:scale(.93);transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.movl.active .cbox{transform:scale(1);}
.cico{font-size:34px;text-align:center;margin-bottom:12px;}
.cmsg{font-size:16px;color:var(--text);text-align:center;line-height:1.65;margin-bottom:20px;}
.cmsg strong{color:var(--red);}
.cacts{display:flex;gap:8px;}
.bdng{flex:1;padding:13px;background:linear-gradient(135deg,var(--red),#dc2626);color:#fff;font-weight:700;font-size:14px;font-family:var(--sans);border:none;border-radius:11px;cursor:pointer;}
.bdng:active{opacity:.85;}

.bkbox{width:100%;max-width:340px;background:var(--s2);border:1px solid var(--border3);border-radius:20px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.7);transform:scale(.93) translateY(16px);transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.movl.active .bkbox{transform:scale(1) translateY(0);}
.bk-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.bk-desc{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:20px;line-height:1.7;}
.bk-row{display:flex;flex-direction:column;gap:10px;}
.bk-btn{width:100%;padding:14px 16px;border-radius:12px;border:none;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;display:flex;align-items:center;gap:10px;transition:opacity .15s;}
.bk-btn:active{opacity:.8;}
.bk-btn.export{background:linear-gradient(135deg,var(--amber),#d97706);color:#0a0a0e;}
.bk-btn.import{background:var(--s3);color:var(--text);border:1px solid var(--border2);}
.bk-btn .bk-ico{font-size:18px;flex-shrink:0;}
.bk-btn .bk-txt{text-align:left;}
.bk-btn .bk-txt span{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:2px;font-family:var(--mono);}
.bk-close{width:100%;padding:11px;background:transparent;border:1px solid var(--border2);border-radius:11px;color:var(--text3);font-size:13px;font-family:var(--sans);cursor:pointer;margin-top:8px;}
.bk-close:active{background:var(--border2);}
.bk-schema{font-size:9px;color:var(--text3);font-family:var(--mono);text-align:center;margin-top:14px;letter-spacing:.05em;opacity:.6;}
.bk-schema strong{color:var(--amber);font-weight:600;}

/* 🪄 마법지팡이 — 정리 파일 미리보기 */
.wand-lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;}
.wand-lblrow .flbl{margin-bottom:0;}
.wand-file{padding:7px 11px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.08);color:var(--amber);border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.wand-box{background:var(--s3);border:1px solid var(--border3);border-radius:12px;padding:12px;margin-bottom:14px;}
.wand-hd{font-size:15px;font-weight:700;color:var(--amber2);margin-bottom:8px;}
.wand-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.ws{background:var(--s2);border:1px solid var(--border2);border-radius:9px;padding:7px 9px;font-size:13px;color:var(--text2);}
.ws b{display:block;font-family:var(--mono);font-size:19px;color:var(--text);}
.ws.new b{color:var(--green2);} .ws.diff b{color:var(--red);} .ws.chk b{color:var(--amber2);}
.wand-box details{border-top:1px solid var(--border2);padding:7px 0 2px;}
.wand-box summary{font-size:14px;font-weight:600;color:var(--text);cursor:pointer;padding:3px 0;}
.wand-list{font-size:13px;color:var(--text2);line-height:1.6;max-height:220px;overflow-y:auto;padding:4px 0 2px 4px;word-break:break-all;}
.wand-list div{padding:2px 0;border-bottom:1px dashed var(--border);}
.wand-list .v{font-family:var(--mono);color:var(--green2);}
.wand-list .o{font-family:var(--mono);color:var(--red);}

.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s3);border:1px solid var(--green);color:var(--green);padding:12px 22px;border-radius:50px;font-size:15px;font-family:var(--mono);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:600;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#drag-ghost{position:fixed;z-index:400;pointer-events:none;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.75),0 0 0 1.5px rgba(245,158,11,.5);transform:scale(1.03) rotate(.5deg);opacity:.9;display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="header">
      <div class="hicon">🔑</div>
      <div class="hinfo">
        <h1>출입코드 노트</h1>
        <p>⠿ 꾹 누르기 = 순서변경</p>
      </div>
      <div class="header-actions">
        <button class="backup-btn" id="btnFold" onclick="foldAll()" title="모두 접기 / 펼치기">⏫</button>
        <button class="backup-btn" onclick="openParseModal()" title="텍스트 자동 추가">🪄</button>
        <button class="backup-btn" onclick="openBackupModal()" title="백업/복원">💾</button>
        <button class="add-rgn-btn" onclick="openModal('aR')" title="지역 추가">＋ 지역</button>
      </div>
    </div>
  </div>
  <div class="swrap">
    <span class="si">🔍</span>
    <input type="text" id="searchInput" placeholder="지역·단지·주소·코드 검색..." autocomplete="off" autocorrect="off" spellcheck="false" oninput="handleSearch(this.value)">
    <button class="clr-btn" id="clrBtn" onclick="clearSearch()" title="검색 지우기">✕</button>

// ════════════════════════════════════════════════════════════════
// 📦 표준 포맷: Access Codes Standard v1
// 배송관리자와 출입코드 노트 양쪽이 동일하게 읽고 쓰는 포맷
// ════════════════════════════════════════════════════════════════
const ACCESS_CODES_SCHEMA = 'access-codes-v1';

// 내부 regions[] → 표준 포맷 payload
function buildStandardPayload(regions, sourceName, ownerName){
  return {
    schema: ACCESS_CODES_SCHEMA,
    exportedAt: new Date().toISOString(),
    source: sourceName || '출입코드노트',
    sourceOwner: ownerName || '',
    regions: (regions||[]).map(r => ({
      name: r.name || '',
      complexes: (r.complexes || []).map(c => ({
        name: c.name || '',
        addr: c.addr || '',
        codes: (c.codes || []).map(k => ({
          section: k.section || '',
          label: k.label || '',
          sublabel: k.sublabel || '',
          value: k.value || '',
          isGlobal: !!k.isGlobal
        }))
      }))
    }))
  };
}

// 파일 JSON → 내부 regions[] (ID 새로 부여)
function parseStandardPayload(json){
  let srcRegions = null;
  let sourceName = '';
  
  // ① 새 표준 포맷 (access-codes-v1)
  if(json && json.schema === ACCESS_CODES_SCHEMA && Array.isArray(json.regions)){
    srcRegions = json.regions;
    sourceName = json.source || '';
  }
  // ② 출입코드 노트 구버전 (version: 1)
  else if(json && json.version === 1 && json.data && Array.isArray(json.data.regions)){
    srcRegions = json.data.regions;
    sourceName = '출입코드노트(구버전)';
  }
  // ③ 단순 regions 배열만 있는 형태
  else if(json && Array.isArray(json.regions)){
    srcRegions = json.regions;
    sourceName = '알 수 없음';
  }
  
  if(!srcRegions) return null;
  
  // 내부 포맷으로 변환 + ID 새로 부여
  const regions = srcRegions.map(r => ({
    id: uid(),
    name: r.name || '',
    complexes: (r.complexes || []).map(c => ({
      id: uid(),
      name: c.name || '',
      addr: c.addr || '',
      codes: (c.codes || []).map(k => ({
        id: uid(),
        section: k.section || '',
        label: k.label || '',
        sublabel: k.sublabel || '',
        value: k.value || '',
        isGlobal: !!k.isGlobal
      }))
    }))
  }));
  
  return { regions, sourceName };
}

function exportBackup(){
  const payload = buildStandardPayload(data.regions, '출입코드노트', '');
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '출입코드_백업_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  closeModal('backupModal');
  showToast('✓ 백업 저장 — 지역 ' + payload.regions.length + '개');
}

function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const result = parseStandardPayload(parsed);
      
      if(!result || !result.regions){
        showToast('⚠️ 올바른 백업 파일이 아닙니다');
        return;
      }
      
      const newRegions = result.regions;
      const totalCodes = newRegions.reduce((sum, r) => 
        sum + r.complexes.reduce((s, c) => s + c.codes.length, 0), 0);
      
      const sourceLabel = result.sourceName ? ' [' + result.sourceName + ']' : '';
      const msg = '백업 파일을 복원할까요?' + sourceLabel + '\n\n' +
                  '지역: ' + newRegions.length + '개\n' +
                  '단지: ' + newRegions.reduce((s,r)=>s+r.complexes.length,0) + '개\n' +
                  '코드: ' + totalCodes + '개\n\n' +
                  '⚠️ 현재 데이터는 덮어씌워집니다.';
      
      if(!confirm(msg)) return;
      
      data = migrateLabels({ regions: newRegions });
      save();
      openR = new Set();
      openC = new Set();
      closeModal('backupModal');
      render();
      showToast('✓ 복원 완료 — 지역 ' + newRegions.length + '개');
    } catch(err) {
      console.error(err);
      showToast('⚠️ 파일을 읽을 수 없어요');
    }
  };
  reader.readAsText(file);
}

const DFLT={regions:[{id:'rg1',name:'대치동',complexes:[
  {id:'cx1',name:'대치현대',addr:'삼성로64길 5',codes:[
    {id:'k001',section:'공동 현관',label:'',sublabel:'',value:'##9077',isGlobal:true},
    {id:'k002',section:'',label:'',sublabel:'101동·105동 전용',value:'##2580',isGlobal:true}]},
  {id:'cx2',name:'세영팔레스A',addr:'영동대로65길 57',codes:[
    {id:'k010',section:'101동',label:'',sublabel:'1005호 · 열쇠 → 엔터 → 1657',value:'열경1657',isGlobal:false},
    {id:'k011',section:'',label:'',sublabel:'1102호',value:'열경1657',isGlobal:false},
    {id:'k012',section:'',label:'',sublabel:'1203호',value:'열경1657',isGlobal:false}]}
]}]};

let data={regions:[]};
let openR=new Set(),openC=new Set(),q='',qt=[];

function save(){try{localStorage.setItem('acn5',JSON.stringify(data));}catch(e){}}
// 예전 '위치 설명'(label) 값은 '사용법·메모'(sublabel)로 합쳐서 보존
function migrateLabels(d){
  (d?.regions||[]).forEach(r=>(r.complexes||[]).forEach(c=>(c.codes||[]).forEach(k=>{
    const lb=(k.label||'').trim();
    if(!lb) return;
    const sb=(k.sublabel||'').trim();
    k.sublabel=sb?(sb.includes(lb)?sb:lb+' · '+sb):lb;
    k.label='';
  })));
  return d;
}
function load(){try{const r=localStorage.getItem('acn5');data=r?JSON.parse(r):JSON.parse(JSON.stringify(DFLT));}catch(e){data=JSON.parse(JSON.stringify(DFLT));}migrateLabels(data);}
function fR(id){return data.regions.find(x=>x.id===id);}
function fC(rid,cid){return fR(rid)?.complexes.find(x=>x.id===cid);}
function fK(rid,cid,kid){return fC(rid,cid)?.codes.find(x=>x.id===kid);}

// 새 코드를 정렬된 위치에 삽입 — 동·구역 → 사용법·메모 순, 숫자는 크기순(3길 14 < 3길 62 < 5길 3).
// 기존 코드 순서는 건드리지 않고 새 코드만 알맞은 자리에 끼워 넣는다.
const NCOLL=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});
const nkey=s=>(s||'').replace(/\s+/g,'');
const ncmp=(a,b)=>NCOLL.compare(nkey(a),nkey(b));
function insertCodeSorted(cx,cd){
  const codes=cx.codes||(cx.codes=[]);
  // 각 코드가 실제로 속한 구역 (비어 있으면 앞선 구역 제목을 물려받음)
  let cur='';const eff=codes.map(k=>{if((k.section||'').trim())cur=k.section.trim();return cur;});
  const sec=(cd.section||'').trim();
  let at;
  const afterLastLE=idxs=>{let a=idxs.length?idxs[0]:0;for(const i of idxs){if(ncmp(codes[i].sublabel,cd.sublabel)<=0)a=i+1;}return a;};
  if(sec){
    const grp=codes.map((_,i)=>i).filter(i=>ncmp(eff[i],sec)===0);
    if(grp.length){
      // 같은 구역 안에서 메모 순서대로
      at=cd.sublabel?afterLastLE(grp):grp[grp.length-1]+1;
    } else {
      // 새 구역: 구역 제목이 더 큰 첫 그룹 앞에 (구역 없는 맨 앞 코드들은 그대로 앞에 둠)
      at=codes.length;
      for(let i=0;i<codes.length;i++){if(eff[i]&&ncmp(eff[i],sec)>0){at=i;break;}}
    }
  } else {
    // 구역 없음: 전체에서 메모 순서대로
    at=cd.sublabel?afterLastLE(codes.map((_,i)=>i)):codes.length;
  }
  codes.splice(at,0,cd);
}

/* ── 복사 · 공유 — 다른 앱 안에 프레임으로 떠 있어도 자체 처리 (부모가 clipboard-write · web-share 권한을 줌) ── */
async function copyOut(text){
  if(!text) return;
  let ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok=true; } }catch(e){}
  if(!ok){
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta); ta.focus(); ta.select(); ok=document.execCommand('copy'); document.body.removeChild(ta);
    }catch(e){}
  }
  showToast(ok?'📋 복사했어요':'⚠️ 복사에 실패했어요');
}
function shareOut(text){
  if(!text) return;
  if(navigator.share){ navigator.share({text}).catch(err=>{ if(!err||err.name!=='AbortError') copyOut(text); }); }
  else copyOut(text);
}
/* 코드 한 줄 제목: 라벨 (부제) — 라벨이 없으면 부제를 제목으로, 둘 다 없으면 빈 문자열 */
function codeTitle(cd){
  const l=String(cd.label||'').trim(), sub=String(cd.sublabel||'').trim();
  if(l&&sub) return `${l} (${sub})`;
  return l||sub;
}
function getComplexCodesText(rid,cid){
  const cx=fC(rid,cid);
  if(!cx||!cx.codes.length) return '';
  let text=`🏢 ${cx.name}\n`;
  if(cx.addr) text+=`📍 ${cx.addr}\n`;
  text+=`━━━━━━━━━━━━━━\n`;
  let cur='';
  cx.codes.forEach(cd=>{
    if(cd.section&&cd.section!==cur){ text+=`\n[${cd.section}]\n`; cur=cd.section; }
    const nm=codeTitle(cd);
    text+=nm?`▫️ ${nm}\n🔑 ${cd.value}\n`:`🔑 ${cd.value}\n`;
  });
  text+=`━━━━━━━━━━━━━━`;
  return text;
}
function getRegionCodesText(rid){
  const rg=fR(rid);
  if(!rg||!rg.complexes.length) return '';
  let text=`🏘️ [${rg.name}] 구역 출입코드 목록\n━━━━━━━━━━━━━━\n`;
  let any=false;
  rg.complexes.forEach(cx=>{
    if(!cx.codes.length) return;
    any=true;
    text+=`\n🏢 ${cx.name}`;
    if(cx.addr) text+=` (${cx.addr})`;
    text+=`\n`;
    let cur='';
    cx.codes.forEach(cd=>{
      if(cd.section&&cd.section!==cur){ text+=`  [${cd.section}]\n`; cur=cd.section; }
      const nm=codeTitle(cd);
      text+=nm?`  ▫️ ${nm}: ${cd.value}\n`:`  🔑 ${cd.value}\n`;
    });
  });
  if(!any) return '';
  text+=`\n━━━━━━━━━━━━━━`;
  return text;
}
function shareComplexCodes(rid,cid){ const t=getComplexCodesText(rid,cid); if(!t){showToast('⚠️ 공유할 코드가 없습니다');return;} shareOut(t); }
function shareRegionCodes(rid){ const t=getRegionCodesText(rid); if(!t){showToast('⚠️ 공유할 코드가 없습니다');return;} shareOut(t); }

function render(){
  const root=document.getElementById('contentRoot');
  if(!data.regions.length){
    root.innerHTML=`<div class="empty-state"><div class="eico">🗺️</div><p>지역이 없습니다.<br>상단 <strong>＋ 지역 추가</strong> 버튼으로<br>새 지역을 만들어 보세요.</p></div>`;
    return;
  }
  let html='',vis=0;
  const M=q?buildMatches():null;
  data.regions.forEach(rg=>{
    let mcx=[];
    if(!q){mcx=rg.complexes;}
    else{
      rg.complexes.forEach(cx=>{
        const ks=M.filter(x=>x.cx===cx);
        if(ks.length)mcx.push({...cx,codes:ks.map(x=>x.cd).filter(Boolean)});
      });
    }
    if(q&&!mcx.length)return;
    vis++;
    const ro=openR.has(rg.id)||!!q;
    const kc=mcx.reduce((a,c)=>a+c.codes.length,0);
    html+=`<div class="region-card${ro?' open':''}" id="rc_${esc(rg.id)}" data-id="${esc(rg.id)}">
<div class="rg-hdr">

function tR(id){openR.has(id)?openR.delete(id):openR.add(id);render();}
/* ⏫ 모두 접기: 여기저기 펼쳐 놓은 지역·단지를 한 번에 정리. 다 접힌 상태에서 누르면 지역만 모두 펼친다 */
function foldAll(){
  if(q){ clearSearch(); }
  if(openR.size||openC.size){ openR.clear(); openC.clear(); render(); showToast('⏫ 모두 접었어요'); }
  else { data.regions.forEach(r=>openR.add(r.id)); render(); showToast('⏬ 지역을 모두 펼쳤어요'); }
  window.scrollTo({top:0,behavior:'smooth'});
}
function tC(id){openC.has(id)?openC.delete(id):openC.add(id);render();}
function handleSearch(v){
  q=nkey(v).toLowerCase();
  // 단어별 토큰: 띄어쓰기 기준 + 한글→숫자 경계("상록108동" → "상록","108동")
  qt=v.toLowerCase().replace(/([가-힣a-z])(?=\d)/g,'$1 ').split(/\s+/).filter(Boolean);
  document.getElementById('contentRoot').classList.toggle('searching',!!q);
  document.querySelector('.swrap').classList.toggle('has-q',!!q);
  render();
}
// 검색 지우고 메인 목록으로
function clearSearch(){const inp=document.getElementById('searchInput');inp.value='';inp.blur();handleSearch('');}
// ── 검색 매칭 ──
// 지역·단지·주소·동구역·메모·코드를 합친 텍스트에서 찾는다.
//  2단계: 검색어 전체가 그대로 포함 (예: "일원로 3길 62")
//  1단계: 단어가 모두 포함 (예: "상록 108동" → 단지 "상록스타힐스" + 구역 "108동")
// 가장 높은 단계의 결과만 보여준다.
// 단어 → 정규식. 숫자로 시작/끝나는 단어는 숫자 경계를 지킨다 ("5길"이 "15길", "49"가 "149"에 걸리지 않게)
function tokRe(t){
  const e=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp((/^\d/.test(t)?'(?:^|[^0-9])':'')+e+(/\d$/.test(t)?'(?![0-9])':''));
}
let qDropped=[];   // 데이터 어디에도 없어서 무시한 단어 (음성 인식이 잘못 들은 말)
function buildMatches(){
  const items=[];
  const T=arr=>nkey(arr.join('|')).toLowerCase();
  data.regions.forEach(rg=>rg.complexes.forEach(cx=>{
    let sec='';
    cx.codes.forEach(cd=>{
      if((cd.section||'').trim())sec=cd.section;   // 비어 있으면 앞선 동·구역을 물려받음
      items.push({rg,cx,cd,text:T([rg.name,cx.name,cx.addr,sec,cd.label,cd.sublabel,cd.value])});
    });
    if(!cx.codes.length)items.push({rg,cx,cd:null,text:T([rg.name,cx.name,cx.addr])});
  }));
  // 3단계: 검색어 전체 포함 → 2단계: 단어 모두 포함 → 1단계: 데이터에 없는 단어는 빼고 나머지 모두 포함
  const all=items.map(x=>x.text).join('|');
  const res=qt.map(tokRe);
  const knownIdx=res.map((r,i)=>r.test(all)?i:-1).filter(i=>i>=0);
  const known=knownIdx.map(i=>res[i]);
  qDropped=qt.filter((t,i)=>!knownIdx.includes(i));
  // 남은 단어가 숫자 하나뿐이면("49") 너무 많이 걸리므로 1단계는 쓰지 않음
  const useReduced=qDropped.length>0&&known.length>0&&(known.length>=2||!/^\d+$/.test(qt[knownIdx[0]]));
  const qre=tokRe(q);
  const lvl=t=>qre.test(t)?3:(res.length>1&&res.every(r=>r.test(t)))?2:(useReduced&&known.every(r=>r.test(t)))?1:0;
  let best=0;
  const lv=items.map(x=>{const l=lvl(x.text);if(l>best)best=l;return{...x,l};});
  return best?lv.filter(x=>x.l===best):[];
}
// 현재 검색어에 걸리는 코드 목록 (음성 검색 결과 판단용)
function searchMatches(){
  if(!q)return[];
  return buildMatches().filter(x=>x.cd).map(x=>({rid:x.rg.id,cid:x.cx.id,cd:x.cd}));
}

// ── 음성 검색: 마이크 버튼 → 말한 내용을 검색창에 넣고 바로 검색 ──
// 한글 숫자("삼길", "육십이")를 숫자로 바꿔서 "일원로 3길 62" 같은 메모와 맞춰준다.
function koNumToDigit(w){
  const d={'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9},u={'십':10,'백':100,'천':1000};
  let total=0,cur=0;
  for(const ch of w){
    if(d[ch]!==undefined)cur=d[ch];
    else if(u[ch]){total+=(cur||1)*u[ch];cur=0;}
  }
  return String(total+cur);
}
function normalizeSpeech(t){
  return t
    .replace(/(^|\s)([일이삼사오육칠팔구십백천]+)(?=\s|$)/g,(m,sp,w)=>sp+koNumToDigit(w))   // "육십이" 단독 토큰
    .replace(/[일이삼사오육칠팔구십백천]+(?=길|동|호|번|라인)/g,w=>koNumToDigit(w))           // "삼길", "백십오동"
    .replace(/번지/g,'').trim();
}
let voiceRec=null,voiceZoom=false;
function toggleVoiceSearch(){
  const btn=document.getElementById('micBtn');
  if(voiceRec){voiceRec.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('⚠️ 이 브라우저는 음성 인식을 지원하지 않아요');return;}
  const inp=document.getElementById('searchInput');
  const rec=new SR();
  rec.lang='ko-KR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onstart=()=>{btn.classList.add('listening');inp.value='';handleSearch('');inp.placeholder='듣는 중... 주소를 말해 주세요';};
  let gotFinal=false;
  rec.onresult=e=>{
    let t='';for(const r of e.results){t+=r[0].transcript;if(r.isFinal)gotFinal=true;}
    inp.value=normalizeSpeech(t);handleSearch(inp.value);
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')showToast('⚠️ 마이크 권한을 허용해 주세요');
    else if(e.error==='no-speech')showToast('🎤 음성이 들리지 않았어요');
    else if(e.error!=='aborted')showToast('⚠️ 음성 인식 오류: '+e.error);
  };
  rec.onend=()=>{
    voiceRec=null;btn.classList.remove('listening');inp.placeholder='지역·단지·주소·코드 검색...';
    if(!gotFinal||!q)return;
    // 정확히 하나면 바로 크게 보기, 여러 개면 목록으로 쭉 보여줌
    const m=searchMatches();
    const drop=qDropped.length?`"${qDropped.join(' ')}" 제외 · `:'';
    if(m.length===1){openR.add(m[0].rid);openC.add(m[0].cid);render();voiceZoom=true;openZoomModal(m[0].rid,m[0].cid,m[0].cd.id);if(drop)showToast(`🎤 ${drop}1개 결과`);}
    else if(!m.length)showToast(`🔍 "${inp.value}" 검색 결과 없음`);
    else showToast(`🎤 ${drop}${m.length}개 결과`);
  };
  voiceRec=rec;
  try{rec.start();}catch(err){voiceRec=null;showToast('⚠️ 음성 인식을 시작할 수 없어요');}
}

const DND={
  active:false,type:null,id:null,rid:null,cid:null,
  src:null,ghost:null,indicator:null,dropBefore:null,offY:0,
  _timer:null,_startY:0,_startX:0,_scrollDir:0,_raf:null,
  _onMoveBound:null,_onEndBound:null,_onCancelBound:null,

  begin(e,type,id,rid,cid){
    if(this.active)return;
    const t=e.touches[0];
    this.type=type;this.id=id;this.rid=rid;this.cid=cid;
    this._startY=t.clientY;this._startX=t.clientX;
    let el=e.currentTarget;
    while(el){if(el.classList.contains('region-card')||el.classList.contains('complex-card')||el.classList.contains('code-row'))break;el=el.parentElement;}
    this.src=el;
    e.currentTarget.classList.add('pressing');this._pressHandle=e.currentTarget;
    this._earlyMove=(ev)=>{
      const dy=Math.abs(ev.touches[0].clientY-this._startY);
      const dx=Math.abs(ev.touches[0].clientX-this._startX);
      if(dy>8||dx>8){clearTimeout(this._timer);this._timer=null;this._pressHandle?.classList.remove('pressing');document.removeEventListener('touchmove',this._earlyMove);}
    };
    document.addEventListener('touchmove',this._earlyMove,{passive:true});
    this._timer=setTimeout(()=>{
      document.removeEventListener('touchmove',this._earlyMove);
      this._activate(t);
    },420);
  },

  _activate(touch){
    this.active=true;if(navigator.vibrate)navigator.vibrate(30);
    this._pressHandle?.classList.remove('pressing');
    const rect=this.src.getBoundingClientRect();this.offY=touch.clientY-rect.top;
    const ghost=document.getElementById('drag-ghost');
    const clone=this.src.cloneNode(true);
    clone.querySelectorAll('.rg-body,.cx-body,.add-row-btn').forEach(b=>b.remove());
    clone.style.cssText='width:100%;';ghost.innerHTML='';ghost.appendChild(clone);
    ghost.style.cssText=`display:block;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;`;
    this.ghost=ghost;this.src.classList.add('drag-placeholder');
    this.indicator=document.createElement('div');this.indicator.className='drop-line';
    document.body.classList.add('dragging');
    this._onMoveBound=(e)=>this._onMove(e);this._onEndBound=()=>this._onEnd();this._onCancelBound=()=>this._onCancel();
    document.addEventListener('touchmove',this._onMoveBound,{passive:false});
    document.addEventListener('touchend',this._onEndBound,{passive:true});
    document.addEventListener('touchcancel',this._onCancelBound,{passive:true});
  },

  _onMove(e){
    if(e.cancelable) e.preventDefault();
    const t=e.touches[0];const cy=t.clientY;
    this.ghost.style.top=(cy-this.offY)+'px';
    const sc=document.getElementById('contentRoot');const sr=sc.getBoundingClientRect();const zone=90;
    if(cy<sr.top+zone)this._scrollDir=-1;else if(cy>sr.bottom-zone)this._scrollDir=1;else this._scrollDir=0;
    this._runScroll(sc);this._findDrop(cy);
  },

  _runScroll(sc){
    if(this._scrollDir===0){if(this._raf){cancelAnimationFrame(this._raf);this._raf=null;}return;}
    if(this._raf)return;
    const step=()=>{sc.scrollTop+=this._scrollDir*6;this._raf=this._scrollDir!==0?requestAnimationFrame(step):null;};
    this._raf=requestAnimationFrame(step);
  },

  _getSiblings(){
    if(this.type==='region'){
      const root=document.getElementById('contentRoot');
      return{container:root,siblings:[...root.children].filter(c=>c.classList.contains('region-card'))};
    }
    else if(this.type==='complex'){
      const rb=document.getElementById('rc_'+this.rid)?.querySelector('.rg-body');
      return{container:rb,siblings:rb?[...rb.children].filter(c=>c.classList.contains('complex-card')):[]};
    }
    else{
      const cb=document.getElementById('cc_'+this.cid)?.querySelector('.cx-body');
      return{container:cb,siblings:cb?[...cb.children].filter(c=>c.classList.contains('code-row')):[]};
    }
  },

  _findDrop(cy){
    const{container,siblings}=this._getSiblings();if(!container)return;
    if(this.indicator.parentNode)this.indicator.parentNode.removeChild(this.indicator);
    let insertBefore=null;
    for(const sib of siblings){if(sib===this.src)continue;const r=sib.getBoundingClientRect();if(cy<r.top+r.height/2){insertBefore=sib;break;}}
    this.dropBefore=insertBefore;
    if(insertBefore){container.insertBefore(this.indicator,insertBefore);}
    else{const btn=container.querySelector('.add-row-btn');btn?container.insertBefore(this.indicator,btn):container.appendChild(this.indicator);}
  },

  _onEnd(){this._reorder();this._cleanup();save();render();},
  _onCancel(){this._cleanup();render();},

  _reorder(){
    let arr;
    if(this.type==='region')arr=data.regions;
    else if(this.type==='complex')arr=fR(this.rid)?.complexes;
    else arr=fC(this.rid,this.cid)?.codes;
    if(!arr)return;
    const fi=arr.findIndex(x=>x.id===this.id);if(fi===-1)return;
    const[item]=arr.splice(fi,1);
    if(this.dropBefore && this.dropBefore.dataset && this.dropBefore.dataset.id){
      const ti=arr.findIndex(x=>x.id===this.dropBefore.dataset.id);
      arr.splice(ti!==-1?ti:arr.length,0,item);
    }
    else arr.push(item);
  },

  _cleanup(){
    clearTimeout(this._timer);this._timer=null;
    if(this._raf){cancelAnimationFrame(this._raf);this._raf=null;}
    this._scrollDir=0;
    document.removeEventListener('touchmove',this._onMoveBound,{passive:false});
    document.removeEventListener('touchend',this._onEndBound);
    document.removeEventListener('touchcancel',this._onCancelBound);
    document.removeEventListener('touchmove',this._earlyMove);
    this._pressHandle?.classList.remove('pressing');
    if(this.ghost){this.ghost.style.display='none';this.ghost.innerHTML='';}
    if(this.indicator?.parentNode)this.indicator.parentNode.removeChild(this.indicator);
    if(this.src)this.src.classList.remove('drag-placeholder');
    document.body.classList.remove('dragging');
    this.active=false;this.type=null;this.id=null;this.rid=null;this.cid=null;
    this.src=null;this.ghost=null;this.indicator=null;this.dropBefore=null;
    this._onMoveBound=null;this._onEndBound=null;this._onCancelBound=null;this._pressHandle=null;
  }
};

function attachHandles(){
  document.querySelectorAll('.dh').forEach(el=>{
    el.addEventListener('touchstart',e=>{
      const d=el.dataset;
      DND.begin(e,d.type,d.id,d.rid||null,d.cid||null);
    },{passive:true});
  });
}

let mCtx={};
function openModal(type,ctx){
  mCtx={type,...(ctx||{})};
  let title='',fields='';
  if(type==='aR'){title='<span>🏘️</span> 지역 추가';fields=fi('rn','지역명','예: 일원동, 개포동, 도곡동...','');}
  else if(type==='eR'){const r=fR(mCtx.r);title='<span>✏️</span> 지역 편집';fields=fi('rn','지역명','',r?.name||'');}
  else if(type==='aC'){title='<span>🏢</span> 단지 추가';fields=fi('cn','단지명','예: 대치현대, 래미하이스턴...','')+fi('ca','주소 (선택)','예: 삼성로64길 5','');}
  else if(type==='eC'){const cx=fC(mCtx.r,mCtx.c);title='<span>✏️</span> 단지 편집';fields=fi('cn','단지명','',cx?.name||'')+fi('ca','주소','',cx?.addr||'');}
  else if(type==='aK'){
    title='<span>🔐</span> 코드 추가';
    fields=codeFields(null,mCtx.r,mCtx.c);
  } else if(type==='eK'){
    const cd=fK(mCtx.r,mCtx.c,mCtx.k);title='<span>✏️</span> 코드 편집';
    fields=codeFields(cd,mCtx.r,mCtx.c);
  }
  document.getElementById('fmTitle').innerHTML=title;
  document.getElementById('fmFields').innerHTML=fields;
  if(type==='aK'||type==='eK'){ drawCodePreview(); ['ks','kb','kv'].forEach(id=>document.getElementById(id).addEventListener('input',drawCodePreview)); document.getElementById('kg').addEventListener('change',drawCodePreview); }
  document.getElementById('formModal').classList.add('active');
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('fmFields').querySelector('input[type=text]')?.focus(),200);
}

function fi(id,lbl,ph,val,list){return`<div class="fg"><label class="flbl" for="${id}">${lbl}</label><input class="finp" type="text" id="${id}" placeholder="${ph}" value="${esc(val)}" autocomplete="off"${list?` list="${list}"`:''}></div>`;}
// 코드 추가/편집 공통 필드: 동·구역 → 주소 및 라인 → 코드 → 공동 코드 → 미리보기 (화면에 보이는 순서와 동일)
function codeFields(cd,rid,cid){
  const cx=fC(rid,cid);
  const secs=[...new Set((cx?.codes||[]).map(k=>(k.section||'').trim()).filter(Boolean))];
  const dl=`<datalist id="secList">${secs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  return dl+

function parseCodeFromLine(trLine){
  let codeValue='';
  let remaining=trLine;
  const codeRegex = /((?:##|#|\*|종\s|열경|경열|열쇠|경비|공동\s)[0-9#*→➔\s\/~()\-–—]+|[0-9]{3,4}#[0-9]{4,6}#?|[0-9]{4,6}[#*])/i;
  const codeMatch = trLine.match(codeRegex);
  if (codeMatch) {
    codeValue = codeMatch[0].trim();
    remaining = trLine.replace(codeMatch[0], '').trim();
  } else {
    const words = trLine.split(/\s+/);
    if (words.length > 1) {
      const lastWord = words[words.length - 1];
      if (/[0-9]/.test(lastWord) && !lastWord.endsWith('동') && !lastWord.endsWith('호')) {
        codeValue = lastWord;
        remaining = trLine.substring(0, trLine.lastIndexOf(lastWord)).trim();
      }
    }
  }
  if (!codeValue) codeValue = '코드 확인 필요';
  return { codeValue, remaining };
}

// ════════════════════════════════════════════════════════════════
// 🗂 정리된 목록 파서
//   ☆단지명(주소)      → 단지
//   ■101동 1~2라인      → 동·구역
//   #1701 8728          → 코드 (뒤의 괄호는 메모)
//   ☆봉은사로 주소(오름차순) → "봉은사로" 단지, 아래 줄들은 "주소 [건물명] 코드"
// ════════════════════════════════════════════════════════════════
function isStructuredText(text){return /^\s*[☆■]/m.test(text)||/주소\s*\(?\s*오름차순/.test(text);}

const ROAD_FIX={'봉은가로':'봉은사로','심성로':'삼성로','강나대로':'강남대로','서능로':'선릉로','보문사로':'봉은사로'};
const CODE_WORDS=new Set(['종','열쇠','경비','경비열쇠','열쇠경비','경찰열쇠','비번','비','문','키','별','시작','호출','엔터','벨','열','경키','기능','ent','확인','체크필요']);
// "봉은사로55길18", "봉은사로 78길25", "봉은사로404", "봉은사로442-9", "선릉로116길" → {road,n,n2,key,display,rest}
function parseRoadAddr(line){
  const m=line.match(/^([가-힣]+로)\s?(\d+)(?:\s?([길겔딜])\s?(\d+(?:-\d+)?)?|(-\d+))?/);
  if(!m)return null;
  const road=ROAD_FIX[m[1]]||m[1];
  const n=+m[2], hasGil=!!m[3];
  let n2=hasGil?(m[4]||''):(m[5]||''), rest=line.slice(m[0].length).trim();
  // "선릉로116길 2378" — 길 뒤 4자리 숫자만 있고 나머지가 없으면 그건 코드
  if(hasGil&&!rest&&/^\d{4,}$/.test(n2)&&/[길겔딜]\s+\d/.test(m[0])){rest=n2;n2='';}
  const [a,b]=n2.replace(/^-/,'').split('-').map(x=>x===undefined||x===''?0:+x);
  return {road,n,hasGil,n2,key:[road,n,hasGil?a||0:0,hasGil?b||0:a||0],
          display:road+' '+n+(hasGil?'길'+(n2?' '+n2:''):(n2?'-'+n2.replace(/^-/,''):'')),rest};
}
// 건물명으로 볼 단어: 한글/영문 2자 이상(+숫자 하나/차), "오네뜨101동", "101동", "세대"
function isNameToken(t){
  if(CODE_WORDS.has(t.toLowerCase()))return false;
  return /^[가-힣a-zA-Z]{2,}\d?(차)?$/.test(t)||/^[가-힣a-zA-Z]{2,}\d{1,3}동$/.test(t)||/^\d{1,4}동$/.test(t);
}
// "동지웰#*3180#", "롯데캐슬클라쎄10#9999" → 건물명 + 코드 분리
function splitNameCode(t){
  const m=t.match(/^([가-힣a-zA-Z]{2,})((?:\d{1,3})?[#*].*)$/);
  if(m&&!CODE_WORDS.has(m[1])&&!/^(열쇠|경비|비번|문|키|종|별|시작|기능)/.test(m[1]))return [m[1],m[2]];
  return [t];
}

function parseStructuredText(text){
  const complexes=[];const skipped=[];
  let cx=null, sec='', secHasCode=true, secLine='', street=null;
  const getCx=(name,addr)=>{let c=complexes.find(x=>nkey(x.name)===nkey(name));if(!c){c={name,addr:addr||'',codes:[]};complexes.push(c);}return c;};
  const flushSec=()=>{if(!secHasCode&&secLine)skipped.push(secLine+' (코드 없음)');};
  const splitNote=s=>{ // 뒤쪽 괄호 → 메모
    const notes=[];s=s.replace(/[\(（]([^()（）]*)[\)）]/g,(m,x)=>{notes.push(x.trim());return ' ';});
    return {main:s.replace(/\s+/g,' ').trim(),note:notes.filter(Boolean).join(', ')};
  };

  text.split('\n').forEach(raw=>{
    const line=raw.replace(/ /g,' ').trim();
    if(!line||/^[ㅡ\-=_─━]+$/.test(line))return;

    if(line.startsWith('☆')){
      flushSec();
      const t=line.replace(/[☆]/g,'').trim();
      if(/주소/.test(t)&&/오름차순/.test(t)){ // 개별 주소 목록 시작
        const road=(t.match(/([가-힣]+로)/)||[])[1]||t.replace(/주소.*$/,'').trim();
        street=getCx(road,'개별 주소 · 오름차순');cx=null;sec='';secHasCode=true;secLine='';
        return;
      }
      const m=t.match(/^(.*?)\s*[\(（](.*?)[\)）]?\s*$/);
      cx=getCx(m?m[1].trim():t,m?m[2].trim():'');street=null;sec='';secHasCode=true;secLine='';
      return;
    }
    if(line.startsWith('■')){
      flushSec();
      sec=line.slice(1).trim().replace(/동(?=\d)/,'동 ');secHasCode=false;secLine=line;
      return;
    }
    // "봉은사로 주소(오름차순)" 처럼 ☆ 없는 목록 머리글
    if(/주소\s*\(?\s*오름차순/.test(line)){
      flushSec();
      const road=(line.match(/([가-힣]+로)/)||[])[1]||line;
      street=getCx(road,'개별 주소 · 오름차순');cx=null;sec='';secHasCode=true;secLine='';
      return;
    }

    if(street){
      const ra=parseRoadAddr(line);
      if(!ra){skipped.push(line);return;}
      // 길 이름별 단지로 (선릉로 목록에 섞인 "삼성로119길25"는 삼성로 단지로)
      let target=getCx(ra.road,'개별 주소 · 오름차순'), section='', rest=ra.rest, isStreet=true;
      // "삼성로99길14(삼성파크)6~8라인#1306 1306" → 단지 삼성파크 / 구역 6~8라인
      const pm=rest.match(/^[\(（]([^()（）]+)[\)）]\s*(\d+\s*~\s*\d+\s*라인)\s*/);
      if(pm){target=getCx(pm[1].trim(),ra.display);section=pm[2].replace(/\s+/g,'');rest=rest.slice(pm[0].length).trim();isStreet=false;}
      const {main,note}=splitNote(rest);
      const toks=main.split(/\s+/).flatMap(splitNameCode).filter(Boolean);
      const names=[],codes=[];
      toks.forEach(t=>(isNameToken(t)&&!codes.length?names:codes).push(t));
      let value=codes.join(' ').trim();
      if(!value&&note&&/[0-9#*]/.test(note)){value=note;}
      if(!value){skipped.push(line+' (코드 없음)');return;}
      const memo=(isStreet?ra.display:'')+(names.length?' '+names.join(' '):'')+(note&&value!==note?' ('+note+')':'');
      target.codes.push({section,sublabel:memo.trim(),value,isGlobal:false,_key:[...ra.key,section]});
      return;
    }

    if(!cx){skipped.push(line);return;}
    const {main,note}=splitNote(line);
    if(!main){skipped.push(line);return;}
    const isGlobal=/^(#\*|##|\*)/.test(main)||(!sec&&/^#\*/.test(main));
    cx.codes.push({section:sec,sublabel:note,value:main,isGlobal});
    secHasCode=true;
  });
  flushSec();

  // 개별 주소 단지는 주소 오름차순 정렬, 중복 제거
  complexes.forEach(c=>{
    if(c.codes.some(k=>k._key)){
      c.codes.sort((a,b)=>{const x=a._key||[],y=b._key||[];for(let i=0;i<5;i++){if(x[i]!==y[i])return typeof x[i]==='string'?ncmp(x[i],y[i]):(x[i]||0)-(y[i]||0);}return 0;});
    }
    const seen=new Set();
    c.codes=c.codes.filter(k=>{delete k._key;const key=nkey(k.section+'|'+k.sublabel+'|'+k.value).toLowerCase();if(seen.has(key))return false;seen.add(key);return true;});
  });
  return {complexes,skipped};
}

// 파싱 결과를 지역에 합치기 (같은 이름 단지는 합치고, 이미 있는 코드는 건너뜀)
function addStructuredToRegion(region,parsed){
  let addedCx=0,addedK=0,dup=0;
  parsed.complexes.forEach(pc=>{
    let cx=region.complexes.find(c=>nkey(c.name).toLowerCase()===nkey(pc.name).toLowerCase());
    const fresh=!cx;
    if(!cx){cx={id:uid(),name:pc.name,addr:pc.addr,codes:[]};region.complexes.push(cx);addedCx++;}
    else if(!cx.addr&&pc.addr)cx.addr=pc.addr;
    const have=new Set(cx.codes.map(k=>nkey(k.section+'|'+k.sublabel+'|'+k.value).toLowerCase()));
    pc.codes.forEach(k=>{
      const key=nkey(k.section+'|'+k.sublabel+'|'+k.value).toLowerCase();
      if(have.has(key)){dup++;return;}
      have.add(key);
      const cd={id:uid(),section:k.section,label:'',sublabel:k.sublabel,value:k.value,isGlobal:k.isGlobal};
      if(fresh)cx.codes.push(cd);else insertCodeSorted(cx,cd);
      addedK++;
    });
  });
  return {addedCx,addedK,dup};
}

function submitParseForm() {
  try {
    const selectEl = document.getElementById('parseTargetRegion');
    if (!selectEl) return;
    const rid = selectEl.value;
    const cidSel = document.getElementById('parseTargetComplex').value;
    const text = document.getElementById('parseInput').value.trim();
    if (!text) {
      showToast('⚠️ 텍스트를 입력해 주세요');
      return;
    }

    // '＋ 새 지역 만들기'는 실제로 추가하기 직전에 이름을 물어보고 만든다
    let region = rid === '__NEW__' ? null : fR(rid);
    if (rid !== '__NEW__' && !region) {
      showToast('⚠️ 대상 지역이 올바르지 않습니다.');
      return;
    }
    const ensureRegion = () => {
      if (region) return region;
      const def = (text.split('\n')[0].match(/^\s*([가-힣]{2,})/) || [])[1] || '새 지역';
      const nm = prompt('새 지역 이름을 적어 주세요', def);
      if (!nm || !nm.trim()) return null;
      region = { id: uid(), name: nm.trim(), complexes: [] };
      data.regions.push(region);
      return region;
    };

    const kind = smartKind(text);

    // ── 🪄 마법지팡이: 정리 파일 · 공유받은 글 · 보내기 파일 · 아무 메모 (단지를 직접 고른 메모는 아래 예전 방식)
    if (kind !== 'structured' && !(kind === 'memo' && cidSel && cidSel !== '__AUTO__')) {
      const parsed = smartParse(text, kind);
      const plan = planAll(region, parsed);
      const nAdd = plan.items.filter(x => x.status !== 'dup').length;
      if (!nAdd) { showToast(plan.items.length ? '✓ 모두 이미 있는 코드예요' : '⚠️ 읽을 수 있는 코드가 없어요'); return; }
      const before = JSON.stringify(data);
      if (!plan.multi && !ensureRegion()) return;
      const r = applyAll(plan, region);
      rememberUndo(before, (plan.multi ? '지역 ' + r.rids.length + '곳' : region.name) + ' · 코드 ' + r.added + '개');
      save(); closeModal('parseModal'); r.rids.forEach(id => openR.add(id)); render();
      showToast(`✓ ${r.added}개 추가` + (r.diff ? ` · ⚠ ${r.diff}곳 확인` : ''));
      return;
    }

    // ── 모드 0: 정리된 목록 (☆단지 / ■동·라인 / 주소 목록) ──
    if (isStructuredText(text)) {
      const parsed = parseStructuredText(text);
      const nK = parsed.complexes.reduce((s,c)=>s+c.codes.length,0);
      if (!nK) { showToast('⚠️ 분류할 수 있는 코드를 찾지 못했습니다.'); return; }
      let msg = `"${region ? region.name : '새 지역'}" 지역에 추가할까요?\n\n단지: ${parsed.complexes.length}개\n코드: ${nK}개`;
      if (parsed.skipped.length) msg += `\n\n건너뛴 줄 ${parsed.skipped.length}개:\n` + parsed.skipped.slice(0,12).join('\n') + (parsed.skipped.length>12?'\n…':'');
      if (!confirm(msg)) return;
      const before = JSON.stringify(data);
      if (!ensureRegion()) return;
      const r = addStructuredToRegion(region, parsed);
      rememberUndo(before, region.name + ' · 코드 ' + r.addedK + '개');
      save(); closeModal('parseModal'); openR.add(region.id); render();
      showToast(`✓ 단지 ${r.addedCx}개 · 코드 ${r.addedK}개 추가` + (r.dup ? ` (중복 ${r.dup}개 제외)` : ''));
      return;
    }

    const lines = text.split('\n');
    let addedCount = 0;

    // ── 모드 1: 특정 단지 지정 ──
    if (cidSel && cidSel !== '__AUTO__') {
      const targetCx = fC(rid, cidSel);
      if (!targetCx) {
        showToast('⚠️ 대상 단지가 올바르지 않습니다.');
        return;
      }
      if (!targetCx.codes) targetCx.codes = [];

      lines.forEach(line => {
        const trLine = line.trim();
        if (!trLine) return;
        const { codeValue, remaining } = parseCodeFromLine(trLine);
        let labelName = remaining.replace(/\s+/g, ' ').trim();
        if (!labelName) labelName = '공동 현관';
        const isGlobal = /공동|전체|공통|정문/.test(labelName) || /##/.test(codeValue);
        insertCodeSorted(targetCx, {
          id: uid(),
          section: '',
          label: '',
          sublabel: labelName,
          value: codeValue,
          isGlobal: isGlobal
        });
        addedCount++;
      });

      if (addedCount > 0) {
        save();
        closeModal('parseModal');
        openR.add(rid);
        openC.add(cidSel);
        render();
        showToast(`✓ ${targetCx.name}에 ${addedCount}개 코드 추가`);
      } else {
        showToast('⚠️ 분류할 수 있는 텍스트를 찾지 못했습니다.');
      }
      return;
    }

    showToast('⚠️ 분류할 수 있는 텍스트를 찾지 못했습니다.');
  } catch (err) {
    console.error(err);
    showToast('⚠️ 분류 중 오류가 발생했습니다.');
  }
}

// ════════════════════════════════════════════════════════════════
// 🪄 마법지팡이 — "▶ 주소 / 아래 줄에 비번" 정리 파일 읽기
//   1. 강남대로                 → 구간 제목 (첫 구간 전의 머리말·⚠ 요약은 읽지 않음)
//   ▶ 강남대로118길66            → 주소. 도로명이면 그 도로 이름 단지(강남대로)로,
//                                   '논현동60-1' 같은 지번은 '논현동 지번' 단지로, 그 밖엔 건물 이름이 단지
//      A동 #4321# (2회)           → 코드. 앞 글자는 메모, 괄호는 메모, (2회)·(원문 '…')는 버림
//      601호 – 뒤쪽 입구 5555*     → '–' 앞은 메모, 뒤에서 첫 번호부터가 코드
//      (…확인)                     → 괄호만 있는 줄은 바로 위 코드의 메모
//   ■ 201동 / (201-1) / 0102 → 0613  → 세대별 비번 (구간 제목이 단지 이름, 201동이 동·구역)
//   - …                          → 분류 안 되는 메모: 가져오지 않고 미리보기에 목록만
//   ⚠                            → 메모 끝에 '⚠ …' 로 남겨 현장에서 확인
// 이미 있는 코드는 건너뛰고, 같은 주소인데 번호가 다르면 지우지 않고 새 코드를 '⚠ 기존과 다름'으로 더한다.
// ════════════════════════════════════════════════════════════════

// 비교용: 띄어쓰기·기호 빼고 (번지의 '-'는 남김: 40-6 ≠ 406)
const wNorm=s=>String(s||'').toLowerCase().replace(/[^0-9a-z가-힣\-]/g,'');
// s 가 p 로 시작하고 바로 뒤가 숫자·'-'가 아님 (28 이 281 에 걸리지 않게)
const wStarts=(s,p)=>s.startsWith(p)&&!(/[0-9]$/.test(p)&&/[0-9\-]/.test(s.charAt(p.length)));

function wandFlag(s){ // "9999 / 4025 ⚠ 비번 다르게 적힘" → {main, flag}
  const i=s.indexOf('⚠');
  if(i<0) return {main:s.trim(),flag:''};
  return {main:s.slice(0,i).trim(), flag:s.slice(i+1).trim()||'확인 필요'};
}
function wandNotes(s){ // 괄호 → 메모. (2회)·(원문 '강나대로') 같은 정리 흔적은 버림
  const notes=[];
  s=s.replace(/[\(（]([^()（）]*)[\)）]/g,(m,x)=>{
    x=x.trim().replace(/^\d+\s*회\s*[,，]\s*/,'');
    if(x&&!/^\d+\s*회$/.test(x)&&!/^원문\s*['‘’"][^'‘’"]*['‘’"]$/.test(x)) notes.push(x);
    return ' ';
  });
  return {main:s.replace(/\s+/g,' ').trim(), notes};
}
// 코드로 볼 낱말: 숫자·#·*·☆ 가 들어 있고 '101동' '1~2호' '10층' 같은 위치 표시가 아님
function wandIsCode(t){
  return /[0-9#*☆]/.test(t) && !/^[\d~·,\-]+(동|호|층|차|라인|단지|길)$/.test(t) && !/^[가-힣a-zA-Z]+\d+(동|호|층|차|단지)$/.test(t)
    && !/^\d+(월|일|시|분|년|개|명|원|번째)$|^\d+월\d+일$/.test(t);
}
function wandValueLine(line){
  const f=wandFlag(line);
  const n=wandNotes(f.main);
  let label='', right=n.main;
  const dm=right.match(/\s[–—-]\s/);           // "601호 – 뒤쪽 입구 5555*"
  if(dm){ label=right.slice(0,dm.index).trim(); right=right.slice(dm.index+dm[0].length).trim(); }
  const toks=right.split(' ').filter(Boolean);
  const i=toks.findIndex(wandIsCode);
  const pre=(i<0?right:toks.slice(0,i).join(' ')).replace(/[:：]$/,'').trim();
  const value=i<0?'':toks.slice(i).join(' ');
  const lab=[label,pre].filter(Boolean).join(' · ');
  if(!value) return {label:lab, value:'번호 없음', notes:n.notes.filter(x=>!/번호\s*없음/.test(x)), flag:f.flag, noCode:true};
  return {label:lab, value, notes:n.notes, flag:f.flag};
}
function wandEntry(s){
  const f=wandFlag(s.replace(/^\s*▶\s*/,''));
  if(f.flag==='확인 필요') f.flag='같은 주소 다른 비번 · 현장 확인';
  const n=wandNotes(f.main);
  const base={notes:n.notes, flag:f.flag};
  const ra=parseRoadAddr(n.main);
  if(ra) return {...base, kind:'road', cx:ra.road, cxAddr:'개별 주소 · 오름차순', where:ra.display, name:ra.rest, key:ra.key};
  const gm=n.main.match(/^([가-힣]+동)\s?(\d+)\s?길\s?(\d+(?:-\d+)?)\s*(.*)$/);   // 일원동 3길 14 → '일원동 개별 주소'
  if(gm) return {...base, kind:'road', cx:gm[1]+' 개별 주소', cxAddr:'개별 주소 · 오름차순', where:gm[1]+' '+gm[2]+'길 '+gm[3], name:gm[4],
    key:[gm[1],+gm[2],+gm[3].split('-')[0],+(gm[3].split('-')[1]||0)]};
  const jm=n.main.match(/^([가-힣]+동)\s?(\d+)(?:-(\d+))?(?![\d길])\s*(.*)$/);   // 논현동60-1 → 지번
  if(jm) return {...base, kind:'road', cx:jm[1]+' 지번', cxAddr:'지번 주소', where:jm[1]+' '+jm[2]+(jm[3]?'-'+jm[3]:''), name:jm[4], key:[jm[1],+jm[2],+(jm[3]||0),0]};
  return {notes:[], flag:f.flag, kind:'bldg', cx:n.main+(n.notes.length?'('+n.notes.join(', ')+')':''), cxAddr:'', where:'', name:'', key:null};
}

function parseWandText(text){
  const complexes=[], skipped=[], memos=[];
  const getCx=(name,addr)=>{let c=complexes.find(x=>wNorm(x.name)===wNorm(name));if(!c){c={name,addr:addr||'',codes:[]};complexes.push(c);}else if(!c.addr&&addr)c.addr=addr;return c;};
  const headRe=/^(\d{1,2})\.\s+(.+)$/;
  const lines=text.split(/\r?\n/);
  const hasHeads=lines.some(l=>headRe.test(l.trim()));
  let inBody=!hasHeads, title='', ent=null, dong='', hhLine='', last=null;

  // 코드 하나 만들기 (메모는 나중에 finish 에서 합침)
  const push=(cx,c)=>{cx.codes.push(c);last=c;return c;};

  lines.forEach(raw=>{
    const s=raw.replace(/ /g,' ').trim();
    if(!s||/^[=\-─━_~]{4,}$/.test(s)) return;
    const hm=s.match(headRe);
    if(hm&&!/[→]/.test(s)){ inBody=true; title=hm[2].trim(); ent=null; dong=''; last=null; return; }
    if(!inBody||s.startsWith('※')) return;

    if(s.startsWith('▶')){ ent=wandEntry(s); dong=''; last=null; return; }
    if(s.startsWith('■')){ dong=s.slice(1).trim().replace(/\s+/g,''); ent=null; hhLine=''; last=null; return; }
    if(/^[-•]\s?/.test(s)){ memos.push(s.replace(/^[-•]\s*/,'')); return; }

    // ── 세대별 비번 (■ 201동 아래) ──
    if(dong){
      const lm=s.match(/^[\(（]\s*\d+\s*-\s*(\d+)\s*[\)）]$/);
      if(lm){ hhLine=lm[1]; return; }
      const cm=s.match(/^(\d{2,4})\s*(?:→|->|=>|:)\s*(.+)$/);
      if(cm){
        const f=wandFlag(cm[2]); const n=wandNotes(f.main);
        if(!n.main){ skipped.push(s); return; }
        const cxName=title.replace(/[\(（][^()（）]*[\)）]/g,'').replace(/세대별\s*비번|비번/g,'').replace(/\s+/g,' ').trim()||'세대별 비번';
        push(getCx(cxName,''),{section:dong, base:cm[1]+'호'+(hhLine?' · '+hhLine+'라인':''), value:n.main, notes:n.notes, flag:f.flag, isGlobal:false,
          mk:{sec:wNorm(dong), addr:wNorm(cm[1]+'호'), lab:''}});
        return;
      }
      skipped.push(s); return;
    }

    if(!ent){ skipped.push(s); return; }
    if(s.startsWith('→')) return;                       // "→ 맨 아래 … 참고" 같은 안내 줄
    const pm=s.match(/^[\(（](.*)[\)）]$/);
    if(pm){ (last||ent).notes.push(pm[1].trim()); return; }   // 괄호만 있는 줄 → 바로 위 코드 메모

    const v=wandValueLine(s);
    const cx=getCx(ent.cx,ent.cxAddr);
    let section='', base, mk;
    if(ent.kind==='road'){
      base=ent.where+(ent.name?' '+ent.name:'')+(v.label?' · '+v.label:'');
      mk={sec:'', addr:wNorm(ent.where), lab:wNorm(v.label), road:true};
    } else {
      // 건물 이름 단지: "1동 1~2호 라인" → 동·구역 '1동' + 메모 '1~2호 라인'
      const dm=v.label.match(/^([A-Za-z0-9·]+동)(?:\s+(.*))?$/);
      if(dm){ section=dm[1]; base=dm[2]||''; } else base=v.label;
      mk={sec:wNorm(section), addr:wNorm(base), lab:''};
    }
    push(cx,{section, base, value:v.value, notes:[...ent.notes,...v.notes], flag:v.flag||ent.flag, noCode:!!v.noCode,
      isGlobal:/공동/.test(v.label), key:ent.key, mk});
  });

  return {complexes, skipped, memos, flags:wandFinish(complexes)};
}
// 메모 합치기 · 도로 단지는 주소 오름차순 · 같은 줄 중복 제거 → ⚠ 표시 개수
function wandFinish(complexes){
  let flags=0;
  complexes.forEach(c=>{
    c.codes.forEach(k=>{
      k.sublabel=(k.base+(k.notes.length?' ('+k.notes.join(', ')+')':'')+(k.flag?' ⚠ '+k.flag:'')).trim();
      if(k.flag||k.notes.some(x=>/확인/.test(x)))k.check=true;
    });
    if(c.codes.some(k=>k.section)&&c.codes.some(k=>!k.section)){
      c.codes=[...c.codes.filter(k=>!k.section),...c.codes.filter(k=>k.section)];
    }
    if(c.codes.some(k=>k.key)){
      c.codes=c.codes.map((k,i)=>({k,i})).sort((a,b)=>{const x=a.k.key||[],y=b.k.key||[];
        for(let j=0;j<4;j++){if(x[j]!==y[j])return typeof x[j]==='string'?ncmp(x[j],y[j]):(x[j]||0)-(y[j]||0);}return a.i-b.i;}).map(o=>o.k);
    }
    const seen=new Set();
    c.codes=c.codes.filter(k=>{const key=wNorm(k.section+'|'+k.sublabel+'|'+k.value);if(seen.has(key))return false;seen.add(key);return true;});
    flags+=c.codes.filter(k=>k.check).length;
  });
  return flags;
}

// 지역에 이미 있는 코드와 비교 → 새로 / 이미 있음 / 기존과 다름
function wAddrOf(sub){
  const t=String(sub||'').trim();
  const ra=parseRoadAddr(t); if(ra) return wNorm(ra.display);
  const jm=t.match(/^([가-힣]+동)\s?(\d+(?:-\d+)?)/); return jm?wNorm(jm[1]+jm[2]):null;
}
function planWand(region, complexes){
  const items=[];
  complexes.forEach(pc=>{
    const ex=region?region.complexes.find(c=>wNorm(c.name)===wNorm(pc.name)):null;
    let cur='';
    const exCodes=ex?ex.codes.map(k=>{if((k.section||'').trim())cur=k.section.trim();return{k,sec:wNorm(cur),sub:wNorm(k.sublabel),addr:wAddrOf(k.sublabel),val:wNorm(k.value)};}):[];
    pc.codes.forEach(c=>{
      // 도로명·지번은 메모 앞의 주소를 다시 읽어 똑같은 주소끼리, 건물 단지는 동·구역+메모 앞부분으로 비교
      const same=exCodes.filter(e=>e.sec===c.mk.sec&&(c.mk.road?e.addr===c.mk.addr:wStarts(e.sub,c.mk.addr))&&(!c.mk.lab||e.sub.includes(c.mk.lab)));
      let status='new', old=[];
      if(same.some(e=>e.val===wNorm(c.value))) status='dup';
      else if(same.length&&!c.noCode){ status='diff'; old=[...new Set(same.map(e=>e.k.value))]; }
      items.push({pc, ex, c, status, old});
    });
  });
  return items;
}
// 묶음이 하나면 고른 지역으로, 여러 지역이 든 파일이면 이름이 같은 지역끼리 (없으면 새로 만듦)
function planAll(selRegion, parsed){
  const multi=parsed.groups.length>1, items=[];
  parsed.groups.forEach((g,gi)=>{
    const region=multi?(data.regions.find(r=>wNorm(r.name)===wNorm(g.rname))||null):selRegion;
    planWand(region,g.complexes).forEach(it=>{it.gi=gi;it.region=region;items.push(it);});
  });
  return {items, parsed, multi};
}
function applyWand(region, items){
  let added=0,newCx=0,diff=0;
  const made=new Map();
  items.forEach(it=>{
    if(it.status==='dup')return;
    let cx=it.ex||made.get(it.pc);
    if(!cx){
      cx=region.complexes.find(c=>wNorm(c.name)===wNorm(it.pc.name));
      if(!cx){cx={id:uid(),name:it.pc.name,addr:it.pc.addr,codes:[]};region.complexes.push(cx);newCx++;cx._fresh=true;}
      made.set(it.pc,cx);
    }
    const sub=it.status==='diff'?it.c.sublabel+' ⚠ 기존('+it.old.join(', ')+')과 다름':it.c.sublabel;
    const cd={id:uid(),section:it.c.section,label:'',sublabel:sub,value:it.c.value,isGlobal:!!it.c.isGlobal};
    if(cx._fresh)cx.codes.push(cd);else insertCodeSorted(cx,cd);
    added++; if(it.status==='diff')diff++;
  });
  made.forEach(cx=>delete cx._fresh);
  return {added,newCx,diff};
}
function applyAll(plan, selRegion){
  let added=0,newCx=0,diff=0;const rids=[];
  plan.parsed.groups.forEach((g,gi)=>{
    const its=plan.items.filter(x=>x.gi===gi);
    if(!its.some(x=>x.status!=='dup'))return;
    let region=selRegion;
    if(plan.multi){
      region=data.regions.find(r=>wNorm(r.name)===wNorm(g.rname));
      if(!region){region={id:uid(),name:g.rname||'받은 지역',complexes:[]};data.regions.push(region);}
    }
    const r=applyWand(region,its);
    added+=r.added;newCx+=r.newCx;diff+=r.diff;rids.push(region.id);
  });
  return {added,newCx,diff,rids};
}

// ════════════════════════════════════════════════════════════════
// 🪄 무엇을 붙여넣었는지 알아보기
//   json  — 📨 보내기 파일 · 💾 백업 파일 (겹치는 건 빼고 합침)
//   wand  — ▶ 정리 파일
//   share — 이 앱의 💬 공유 글 (🏘️ [지역] / 🏢 단지 / [동] / ▫️ 메모 / 🔑 코드)
//   structured — ☆단지 / ■동 목록 (예전 방식 그대로)
//   memo  — 그 밖의 아무 메모 (카톡 대화 내보내기 포함) → 한 줄씩 주소·건물·코드를 찾아 ▶ 정리 파일로 바꿔 읽음
// ════════════════════════════════════════════════════════════════
function smartKind(text){
  const t=text.trim();
  if(/^[\[{]/.test(t)){try{JSON.parse(t);return 'json';}catch(e){}}
  if(/^\s*▶/m.test(text))return 'wand';
  if(/^\s*(🏘|🏢)/m.test(text)&&/^\s*(🔑|▫)/m.test(text))return 'share';
  if(isStructuredText(text))return 'structured';
  return 'memo';
}
const KIND_NAME={json:'받은 파일로',wand:'정리 파일로',share:'공유받은 목록으로',memo:'메모 글로'};
function smartParse(text,kind){
  if(kind==='json')return parseJsonForWand(text);
  if(kind==='share')return parseShareText(text);
  let skip=[], src=text;
  if(kind==='memo'){const m=memoToWand(text);src=m.text;skip=m.skipped;}
  const p=parseWandText(src);
  return {groups:[{rname:null,complexes:p.complexes}], skipped:[...skip,...p.skipped], memos:p.memos, flags:p.flags};
}

// 앱에 저장된 모양(동·구역/메모/코드) 그대로인 코드 → 비교용 정보 붙이기
function wandPlainCode(section,sublabel,value,isGlobal){
  const sub=String(sublabel||'').trim(), sec=String(section||'').trim();
  const ad=wAddrOf(sub), lm=sub.match(/·\s*([^·(⚠]+)/);
  return {section:sec, base:sub, notes:[], flag:'', value:String(value||'').trim(), isGlobal:!!isGlobal,
    mk:ad?{sec:wNorm(sec),addr:ad,lab:lm?wNorm(lm[1]):'',road:true}:{sec:wNorm(sec),addr:wNorm(sub),lab:''}};
}
// 📨 보내기 파일 / 💾 백업 파일
function parseJsonForWand(text){
  let j=null;try{j=JSON.parse(text.trim());}catch(e){}
  const r=j&&parseStandardPayload(j);
  if(!r)return {groups:[],skipped:['출입코드 파일이 아니에요'],memos:[],flags:0};
  const groups=r.regions.map(rg=>({rname:rg.name,complexes:rg.complexes.map(c=>{
    let cur='';   // 비어 있는 동·구역은 앞의 것을 물려받으므로 풀어서 적어 둠
    return {name:c.name,addr:c.addr||'',codes:c.codes.map(k=>{if((k.section||'').trim())cur=k.section.trim();
      return wandPlainCode(cur,[k.label,k.sublabel].map(x=>(x||'').trim()).filter(Boolean).join(' · '),k.value,k.isGlobal);})};
  })}));
  const flags=groups.reduce((s,g)=>s+wandFinish(g.complexes),0);
  return {groups,skipped:[],memos:[],flags};
}
// 💬 공유 글 (지역 전체 · 단지 하나 둘 다)
function parseShareText(text){
  const groups=[], skipped=[];
  let g=null, cx=null, sec='', memo=null;
  const G=()=>{if(!g){g={rname:null,complexes:[]};groups.push(g);}return g;};
  const lines=text.split(/\r?\n/).map(l=>l.replace(/ /g,' ').trim());
  const add=(m,v)=>{if(!v)return;if(!cx){cx={name:'받은 코드',addr:'',codes:[]};G().complexes.push(cx);}cx.codes.push(wandPlainCode(sec,m,v,false));};
  lines.forEach((s,i)=>{
    if(!s||/^[━─=\-]{3,}$/.test(s))return;
    let m;
    if((m=s.match(/^🏘️?\s*\[(.+?)\]/))){g={rname:m[1].trim(),complexes:[]};groups.push(g);cx=null;sec='';memo=null;return;}
    if((m=s.match(/^🏢️?\s*(.+)$/))){
      let nm=m[1].trim(),ad='';const pm=nm.match(/^(.*?)\s+\(([^()]*)\)$/);if(pm){nm=pm[1].trim();ad=pm[2].trim();}
      cx=G().complexes.find(c=>wNorm(c.name)===wNorm(nm));
      if(!cx){cx={name:nm,addr:ad,codes:[]};G().complexes.push(cx);}
      sec='';memo=null;return;
    }
    if((m=s.match(/^📍️?\s*(.+)$/))){if(cx&&!cx.addr)cx.addr=m[1].trim();return;}
    if((m=s.match(/^\[(.+)\]$/))){sec=m[1].trim();memo=null;return;}
    if((m=s.match(/^▫️?\s*(.+)$/))){
      const body=m[1].trim(), next=lines.slice(i+1).find(x=>x)||'';
      const k=body.lastIndexOf(': ');
      if(!/^🔑/.test(next)&&k>0){add(body.slice(0,k).trim(),body.slice(k+2).trim());memo=null;}
      else memo=body;
      return;
    }
    if((m=s.match(/^🔑️?\s*(.+)$/))){add(memo||'',m[1].trim());memo=null;return;}
    skipped.push(s);
  });
  const flags=groups.reduce((s,gg)=>s+wandFinish(gg.complexes),0);
  return {groups,skipped,memos:[],flags};
}

// ── 아무 메모 → ▶ 정리 파일 ──
//  "강남대로114길28 종3077"            → ▶ 강남대로 114길 28 / 종3077
//  "세진하우스 강남대로122길62 종1234"   → ▶ 강남대로 122길 62 세진하우스 / 종1234
//  "대치현대 101동 공동현관 ##9077"      → ▶ 대치현대 / 101동 공동현관 – ##9077
//  "논현로111길21"  다음 줄 "열쇠3690"   → 주소만 있는 줄 아래의 코드만 있는 줄은 그 주소 것
//  "A동 #4321# B동 #1877"               → 한 줄에 여러 개면 위치(동·호·현관) 단어에서 끊음
//  카톡 대화 내보내기의 [이름] [오후 3:12] · 날짜 줄 · 인사말은 걸러냄
const W_LOC=/^([A-Za-z0-9·~,\-]*(동|호|층|라인)|공동현관|공동|현관|정문|후문|쪽문|철문|뒷문|주차장|지하|입구|뒤쪽|앞쪽|엘리베이터|엘베)$/;
const W_BLDG=/(아파트|빌라|빌딩|하우스|타워|맨션|오피스텔|단지|캐슬|자이|푸르지오|래미안|레미안|힐스|파크|팰리스|센타|센터|상가|위브|빌|홈|텔|스테이트|더샵|편한세상|주택|원룸|기숙사|회관|아이빌|프라임)/;
const W_CHAT=/(요|니다|죠|네요|ㅋ|ㅎ|\?|!|감사|수고|부탁|알겠|사진|동영상|이모티콘|삭제된 메시지|파일:)/;
function wandStripChat(s){
  return s.replace(/^\[[^\]]{1,30}\]\s*\[[^\]]{1,20}\]\s*/,'')                       // [이름] [오후 3:12]
    .replace(/^\d{4}[.\-/년]\s*\d{1,2}[.\-/월]\s*\d{1,2}[.일]?\s*(오전|오후)?\s*\d{1,2}:\d{2}\s*,?\s*[^:：]{1,20}\s*[:：]\s*/,'') // 2024. 6. 19. 오후 3:12, 이름 :
    .replace(/^(오전|오후)\s*\d{1,2}:\d{2}\s*/,'')
    .replace(/^(?:[-•·▪◦]|\d{1,3}[.)])\s+/,'')
    .trim();
}
function wandSplitRest(rest){
  const toks=[];
  rest.replace(/[\(（][^()（）]*[\)）]|\S+/g,m=>{splitNameCode(m).forEach(x=>toks.push(x));return m;});
  let i=0;const name=[];
  while(i<toks.length&&!wandIsCode(toks[i])&&!W_LOC.test(toks[i])&&!/^[\(（–—]/.test(toks[i]))name.push(toks[i++]);
  const pairs=[];let lab=[],code=[];
  for(;i<toks.length;i++){
    const t=toks[i];
    if(/^[–—]$/.test(t))continue;
    if(/^[\(（]/.test(t)){(code.length?code:lab).push(t);continue;}
    if(wandIsCode(t)){code.push(t);continue;}
    if(code.length&&W_LOC.test(t)){pairs.push({lab:lab.join(' '),code:code.join(' ')});lab=[t];code=[];continue;}
    (code.length?code:lab).push(t);
  }
  if(code.length)pairs.push({lab:lab.join(' '),code:code.join(' ')});
  return {name:name.join(' '),pairs,pend:code.length?'':lab.join(' ')};
}
function memoToWand(text){
  const out=[], skipped=[];
  let cur=null, pend='';
  const open=h=>{if(cur!==h){out.push('▶ '+h);cur=h;}pend='';};
  const val=(lab,code)=>{lab=[pend,lab].filter(Boolean).join(' ');out.push('   '+(lab?lab+' – ':'')+code);};
  text.split(/\r?\n/).forEach(raw=>{
    const orig=raw.replace(/ /g,' ').trim();
    let s=wandStripChat(orig);
    if(!s)return;
    if(/^-{3,}.*-{3,}$/.test(s)||/^\d{4}년\s*\d{1,2}월\s*\d{1,2}일[^0-9#*]*$/.test(s)||/카카오톡 대화|저장한 날짜/.test(s))return;
    s=s.replace(/^▶\s*/,'');
    // 주소가 줄 중간에 있으면 앞부분은 건물 이름으로
    let pre='';
    const mid=s.match(/[가-힣]+로\s?\d+(?:\s?길\s?\d+(?:-\d+)?|-\d+)?/);
    if(mid&&mid.index>0&&!parseRoadAddr(s)){pre=s.slice(0,mid.index).trim();s=s.slice(mid.index);}
    const ra=parseRoadAddr(s);
    const gm=!ra&&s.match(/^([가-힣]+동)\s?(\d+)\s?길\s?(\d+(?:-\d+)?)(.*)$/);
    const jm=!ra&&!gm&&s.match(/^([가-힣]+동)\s?(\d+(?:-\d+)?)(?![\d길])(.*)$/);
    let addr='', rest=s;
    if(ra){addr=ra.display;rest=ra.rest;}
    else if(gm){addr=gm[1]+' '+gm[2]+'길 '+gm[3];rest=gm[4];}
    else if(jm){addr=jm[1]+' '+jm[2];rest=jm[3];}
    const sp=wandSplitRest(rest.trim());
    if(addr){
      const nm=[pre,sp.name].filter(Boolean).join(' ');
      if(W_CHAT.test(nm)){skipped.push(orig);return;}
      open(addr+(nm?' '+nm:''));
      sp.pairs.forEach(p=>val(p.lab,p.code));
      pend=sp.pend;
      return;
    }
    const nm=[pre,sp.name].filter(Boolean).join(' ');
    if(nm&&(W_CHAT.test(nm)||nm.length>25)){skipped.push(orig);return;}
    if(nm&&sp.pairs.length){open(nm);sp.pairs.forEach(p=>val(p.lab,p.code));pend=sp.pend;return;}
    if(!nm&&sp.pairs.length){
      if(cur===null){skipped.push(orig+'  (어느 주소인지 없음)');return;}
      sp.pairs.forEach(p=>val(p.lab,p.code));pend=sp.pend;return;
    }
    if(nm&&!sp.pairs.length&&W_BLDG.test(nm)&&!/\d{3,}/.test(nm)){open(nm);pend=sp.pend;return;}
    if(!nm&&sp.pend&&cur!==null){pend=sp.pend;return;}   // "101동" 만 있는 줄 → 다음 코드의 위치
    skipped.push(orig);
  });
  return {text:out.join('\n'),skipped};
}

// ── 미리보기: 붙여넣거나 파일을 열면 바로 몇 개가 새로 들어가는지 보여줌 ──
let wandTimer=null, wandAutoText='';
function schedWandPreview(ms){clearTimeout(wandTimer);wandTimer=setTimeout(renderWandPreview,ms==null?250:ms);}
function renderWandPreview(){
  const box=document.getElementById('wandPreview');
  const btn=document.getElementById('parseSubmitBtn');
  const cxFg=document.getElementById('parseComplexFg');
  if(!box)return;
  const text=document.getElementById('parseInput').value;
  const kind=text.trim()?smartKind(text):'';
  const cidSel=document.getElementById('parseTargetComplex').value;
  cxFg.style.display=(kind&&kind!=='memo'&&kind!=='structured')?'none':'';   // 정리된 글은 단지를 스스로 나눔
  if(!kind||kind==='structured'||(kind==='memo'&&cidSel&&cidSel!=='__AUTO__')){box.innerHTML='';btn.textContent='분류 및 추가';return;}
  const parsed=smartParse(text,kind);
  // 받은 목록의 지역 이름과 같은 지역이 있으면 처음 한 번 그 지역을 골라 둠
  const selEl=document.getElementById('parseTargetRegion');
  if(wandAutoText!==text&&parsed.groups.length===1&&parsed.groups[0].rname){
    const same=data.regions.find(r=>wNorm(r.name)===wNorm(parsed.groups[0].rname));
    if(same&&selEl.value!==same.id){selEl.value=same.id;}
  }
  wandAutoText=text;
  const rid=selEl.value;
  const region=rid==='__NEW__'?null:fR(rid);
  const plan=planAll(region,parsed);
  const cnt=s=>plan.items.filter(x=>x.status===s).length;
  const nNew=cnt('new'),nDup=cnt('dup'),nDiff=cnt('diff'),nAdd=nNew+nDiff;
  const L=(arr,f)=>`<div class="wand-list">${arr.map(f).join('')}</div>`;
  const byCx=new Map();
  plan.items.forEach(it=>{const o=byCx.get(it.pc)||{pc:it.pc,ex:it.ex,rn:it.region?it.region.name:(parsed.groups[it.gi].rname||''),n:0,d:0};if(it.status==='dup')o.d++;else o.n++;byCx.set(it.pc,o);});
  const diffs=plan.items.filter(x=>x.status==='diff');
  const checks=plan.items.filter(x=>x.status!=='dup'&&x.c.check);
  const outs=[...parsed.memos.map(m=>'📝 '+m),...parsed.skipped.map(m=>'⏭ '+m)];
  const target=plan.multi?`지역 ${parsed.groups.length}곳 (이름 같은 지역에 합침)`:(region?region.name:'새 지역');
  const from=parsed.groups.length===1&&parsed.groups[0].rname?`<div class="fhint" style="margin:-4px 0 8px">보낸 쪽 지역 이름: ${esc(parsed.groups[0].rname)}</div>`:'';
  box.innerHTML=`<div class="wand-box">
<div class="wand-hd">🪄 ${KIND_NAME[kind]} 읽었어요 — ${esc(target)}</div>${from}
<div class="wand-stats">
<div class="ws new">새로 추가<b>${nNew}</b></div>
<div class="ws">이미 있음 (건너뜀)<b>${nDup}</b></div>
<div class="ws diff">기존과 번호 다름<b>${nDiff}</b></div>
<div class="ws chk">⚠ 현장 확인 표시<b>${checks.length}</b></div>
</div>
${byCx.size?`<details${kind==='memo'?' open':''}><summary>🏢 단지별 (${byCx.size}곳)</summary>${L([...byCx.values()],o=>`<div>${plan.multi?esc(o.rn)+' › ':''}${esc(o.pc.name)} — 새로 <span class="v">${o.n}</span>${o.d?` · 있음 ${o.d}`:''}${o.ex?' · 기존 단지에 합침':' · 새 단지'}</div>`)}</details>`:''}
${kind==='memo'&&nAdd?`<details><summary>👀 이렇게 나눴어요 (${nAdd})</summary>${L(plan.items.filter(x=>x.status!=='dup'),x=>`<div>${esc(x.pc.name)} · ${esc([x.c.section,x.c.sublabel].filter(Boolean).join(' '))} <span class="v">${esc(x.c.value)}</span></div>`)}</details>`:''}
${nDiff?`<details open><summary>⚠ 기존과 번호 다름 (${nDiff})</summary>${L(diffs,x=>`<div>${esc(x.c.sublabel||x.c.section)}<br>기존 <span class="o">${esc(x.old.join(', '))}</span> → 새 <span class="v">${esc(x.c.value)}</span></div>`)}</details>`:''}
${checks.length?`<details><summary>🔎 현장 확인 표시 (${checks.length})</summary>${L(checks,x=>`<div>${esc(x.pc.name)} · ${esc([x.c.section,x.c.sublabel].filter(Boolean).join(' '))} <span class="v">${esc(x.c.value)}</span></div>`)}</details>`:''}
${outs.length?`<details${kind==='memo'&&outs.length<=8?' open':''}><summary>📝 가져오지 않는 줄 (${outs.length})</summary>${L(outs,m=>`<div>${esc(m)}</div>`)}</details>`:''}
<div class="fhint" style="margin-top:8px">기존 코드는 지우지 않아요. 번호가 다른 곳은 새 코드에 ⚠ 표시를 달아 옆에 더해요. 추가한 뒤 💾 에서 되돌릴 수 있어요.</div>
</div>`;
  btn.textContent=nAdd?`🪄 ${nAdd}개 추가`:'추가할 새 코드 없음';
}

// 📄 파일 열기 — 메모장 저장 방식(UTF-8 / 옛 한글 ANSI) 둘 다
function loadParseFile(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=e=>{
    const buf=e.target.result;
    let t=new TextDecoder('utf-8').decode(buf);
    if(t.includes('�')){try{t=new TextDecoder('euc-kr').decode(buf);}catch(err){}}
    document.getElementById('parseInput').value=t.replace(/^﻿/,'');
    schedWandPreview(0);
    showToast('📄 '+file.name+' 불러옴');
  };
  rd.readAsArrayBuffer(file);
}

// ── 📨 다른 사람에게 보내기 — 전체 코드를 파일 하나로 (받는 쪽 🪄 가 겹치는 건 빼고 합침)
// 폰 공유 창은 .json 을 못 넘기는 경우가 있어 내용은 표준 JSON, 이름은 .txt 로 보냄
async function sendCodesFile(){
  const n=data.regions.reduce((s,r)=>s+r.complexes.reduce((a,c)=>a+c.codes.length,0),0);
  if(!n){showToast('⚠️ 보낼 코드가 없어요');return;}
  const payload=buildStandardPayload(data.regions,'출입코드노트','');
  const name='출입코드_보내기_'+new Date().toISOString().slice(0,10)+'.txt';
  const file=new File([JSON.stringify(payload)],name,{type:'text/plain'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'출입코드 '+n+'개'});
      closeModal('backupModal');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  showToast('📨 파일 저장 — 카톡으로 보내 주세요');
}

// ── ↩ 마지막 자동 추가 되돌리기 (추가하기 직전 상태를 한 번 기억) ──
function rememberUndo(before,label){
  try{localStorage.setItem('acn5_undo',JSON.stringify({at:Date.now(),label,data:before}));}catch(e){}
}
function refreshUndoBtn(){
  const b=document.getElementById('undoImportBtn');if(!b)return;
  let u=null;try{u=JSON.parse(localStorage.getItem('acn5_undo')||'null');}catch(e){}
  b.hidden=!u;
  if(u){const d=new Date(u.at);document.getElementById('undoImportInfo').textContent=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${u.label} 추가 전으로`;}
}
function undoLastImport(){
  let u=null;try{u=JSON.parse(localStorage.getItem('acn5_undo')||'null');}catch(e){}
  if(!u){showToast('⚠️ 되돌릴 기록이 없어요');return;}
  if(!confirm(`마지막 자동 추가(${u.label})를 되돌릴까요?\n\n그 뒤에 직접 고친 내용도 함께 사라져요.`))return;
  try{data=migrateLabels(JSON.parse(u.data));}catch(e){showToast('⚠️ 되돌리기 실패');return;}
  save();try{localStorage.removeItem('acn5_undo');}catch(e){}
  openR=new Set();openC=new Set();closeModal('backupModal');render();
  showToast('↩ 되돌렸어요');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')['confirmModal','formModal','backupModal','parseModal','zoomModal'].forEach(id=>{
    const el=document.getElementById(id);if(el && el.classList.contains('active'))closeModal(id);
  });
  if(e.key==='Enter'&&document.getElementById('formModal').classList.contains('active')){
    if(document.activeElement?.tagName==='INPUT'&&document.activeElement.type!=='checkbox')submitForm();
  }
});

load();render();
